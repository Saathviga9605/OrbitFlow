  - id: ETSI-EN-302-307-2
    standard: ETSI EN 302 307-2 (DVB-S2X), Annex E
    title: DVB-S2X superframe formats, including beam-hopping support
    organization: ETSI / DVB
    version: V1.x
    version_verified: false
    in_knowledge_base: null
    scope: Physical-layer framing that carries beam-hopping illumination
    requirement: Beam switching aligned to superframe boundaries with defined switching overhead
    orbitflow_components: []
    kb_rules: []
    implementation_evidence: []
    status: not_implemented
    not_implemented: Capacity is Shannon-based; no MODCOD table, no superframe, and beam switching has no cost in the simulator.
    next_step: Add a MODCOD table and a switching penalty, then re-evaluate BRIDGE's higher switch rate.
