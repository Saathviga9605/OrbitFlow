  - id: ITU-R-SF.358-5
    standard: ITU-R SF.358-5
    title: Maximum permissible values of power flux-density at the surface of the Earth produced by satellites in the fixed-satellite service using the same frequency bands above 1 GHz as line-of-sight radio-relay systems
    organization: ITU-R
    version: "SF.358-5 (10/1995)"
    version_verified: true
    in_knowledge_base: r_rec_sf_358_5_199510_w_pdf_e
    scope: Surface power flux-density limits by angle of arrival
    requirement: PFD at the Earth's surface stays below the angle-dependent mask
    orbitflow_components: [scripts/run_studies.py (pfd study), agents/supervisor.py (R8 verdicts), bam/validator.py (power caps)]
    kb_rules: [R1_border_power_cap, R8_pfd_mask]
    implementation_evidence: [results/studies/pfd_mask.json, tests/test_system.py]
    status: partial
    not_implemented: Indicative only - 20 GHz lies outside the listed bands and Tx gain is assumed; not part of the default flood scenario.
    next_step: Apply the mask that actually governs the simulated band, with a reviewed antenna pattern.
