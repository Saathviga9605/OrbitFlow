# Standards and frameworks mapping. Machine-readable; served by /api/governance and shown in the UI.
# OrbitFlow claims NO certification, compliance or conformance with any entry below.
# status values:
#   implemented_in_simulation  the stated requirement is implemented and exercised in the simulator
#   partial                    part of the requirement is implemented; the rest is listed under not_implemented
#   conceptual                 design is informed by the document; nothing is implemented against its text
#   proposed                   identified as relevant future work only
#   not_implemented            relevant, deliberately not built yet
#   not_applicable             reviewed and out of OrbitFlow's scope
# version_verified: false means the edition was not checked against the publisher's site in this work.
statuses: [implemented_in_simulation, partial, conceptual, proposed, not_implemented, not_applicable]
entries:
  - id: ITU-T-Y.3172
    standard: ITU-T Y.3172
    title: Architectural framework for machine learning in future networks including IMT-2020
    organization: ITU-T
    version: "06/2019"
    version_verified: true
    in_knowledge_base: t_rec_y_3172_201906_i_pdf_e
    scope: ML pipeline (source, collector, preprocessor, model, policy, distributor, sink), ML sandbox, MLFO
    requirement: Model output passes a policy function before it reaches the network; models are trained and validated in a sandbox
    orbitflow_components: [agents/supervisor.py (Policy agent), bam/validator.py (guard), digital_twin/ (sandbox role)]
    kb_rules: [R6_ml_policy_before_sink, R7_sandbox_validation]
    implementation_evidence: [agents/supervisor.py, bam/validator.py, tests/test_guard.py, tests/test_agents.py]
    status: partial
    not_implemented: No ML Function Orchestrator (MLFO), no ML intent, no standard interfaces between pipeline nodes; mapping is by design, not tested conformance.
    next_step: Express the profile + scenario as a Y.3172-style ML intent and map pipeline nodes to named interfaces.
